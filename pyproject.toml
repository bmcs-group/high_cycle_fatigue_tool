[project]
name = "hcft"
dynamic = ["version"]
description = "High Cycle Fatigue Tool: the cycle table of fatigue tests (a headless core) and a GUI for processing CSV files from fatigue experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
authors = [{ name = "H. Spartali & BMCS-Group", email = "hspartali@imb.rwth-aachen.de" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
# The core, hcft.cycles, needs numpy alone. The GUI (the hcft command, the Windows installer) needs the extra.
dependencies = [
    "numpy",
]

[project.optional-dependencies]
gui = [
    "pandas",
    "scipy",
    "matplotlib",
    "traits",
    "traitsui",
    "pyface",
    "pyqt5",
]
# hcft-table, the command line for NetCDF files
nc = [
    "netCDF4",
]

[project.urls]
Homepage = "https://github.com/bmcs-group/high_cycle_fatigue_tool"
DOI = "https://doi.org/10.5281/zenodo.3603816"

[project.gui-scripts]
hcft = "hcft.__main__:main"

[project.scripts]
hcft-table = "hcft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "hcft/version.py"

[tool.hatch.build.targets.wheel]
packages = ["hcft"]

[tool.uv]
# `uv run` and `uv sync` in this checkout install the default groups, so `uv run hcft` starts the GUI as before.
# A package that depends on hcft (reproxis) gets numpy alone.
default-groups = ["gui", "dev"]
# pyqt5-qt5 doesn't publish wheels for every platform in every release;
# make sure the lock file resolves to versions installable on all common platforms.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
]

[dependency-groups]
gui = [
    "hcft[gui]",
]
dev = [
    "hcft[nc]",
    "pytest",
    "ruff",
]
build = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# The notebooks and the PyInstaller packaging (its .spec gets its names from PyInstaller) stay outside.
extend-exclude = ["notebooks", "Notebooks", "packaging"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    "RUF001",  # σ, ε, ‰ and × in strings, docstrings and comments are meant
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/hcft1_reference.py" = ["E", "W", "UP", "RUF"]  # verbatim from hcft 1.1.0
